name: Expo Build APK
on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install

      - name: Build APK en Ligne
        env:
          EXPO_TOKEN: "hhyJupdt76HX9va1sL2HAQGSA_NBhp4D8T0Q6dtF"
          EAS_NO_VCS: "1"
        run: |
          eas project:init --force
          # Ity baiko ity dia hiteraka ny Android Keystore ho azy any amin'ny server nefa tsy mametraka fanontaniana
          eas credentials --platform android --profile preview --non-interactive || true
          # Rehefa vonona izany dia mandeha amin'izay ilay build tsotra
          eas build --platform android --profile preview --non-interactive
