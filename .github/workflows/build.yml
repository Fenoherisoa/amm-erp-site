name: Expo Build APK
on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm install

      - name: Build APK en Ligne
        env:
          EXPO_TOKEN: "" # Tsy mila token satria mampiasa ny fidirana etsy ambany
          EXPO_CLI_USERNAME: "Fenoherisoa"
          EXPO_CLI_PASSWORD: "2241510Feno$"
        run: |
          eas build --platform android --profile preview --non-interactive --no-auto-submit
